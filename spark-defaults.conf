# spark-defaults.conf: tuned for local development on a laptop.
# spark.driver.memory is written by entrypoint.sh from SPARK_DRIVER_MEMORY.

spark.master                      local[*]
spark.sql.shuffle.partitions      8
spark.serializer                  org.apache.spark.serializer.KryoSerializer
spark.local.dir                   /tmp/spark-local
spark.ui.port                     4040
spark.eventLog.enabled            false

# ── Iceberg (JARs are baked into $SPARK_HOME/jars by the Dockerfile) ─────────
spark.sql.extensions              org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

# Catalog "local": Iceberg REST catalog, data files in MinIO via S3FileIO.
# Table names look like local.<namespace>.<table>, e.g. local.airline.flights
spark.sql.catalog.local                    org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.local.type               rest
spark.sql.catalog.local.uri                http://iceberg-rest:8181
spark.sql.catalog.local.io-impl            org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.local.s3.endpoint        http://minio:9000
spark.sql.catalog.local.s3.path-style-access true
spark.sql.catalog.local.client.region      us-east-1
# S3 credentials come from AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY in the
# container environment (set in docker-compose.yml), never from this file.
